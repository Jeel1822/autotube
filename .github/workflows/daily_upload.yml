name: Daily Upload Pipeline

on:
  schedule:
    # Fires every hour. src/scheduler.py checks each channel's config and
    # only runs uploads that are actually due at the current UTC hour —
    # so the real output stays at exactly 1 long-form + 5 shorts per
    # channel per day, spread across the day, no matter how often this
    # cron ticks.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Run a single channel manually (leave blank for scheduler)"
        required: false
      short:
        description: "Make it a short?"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build video, skip upload)?"
        type: boolean
        default: false

jobs:
  run_pipeline:
    runs-on: ubuntu-24.04
    container:
      image: jrottenberg/ffmpeg:7.1-ubuntu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y python3 python3-pip python3-venv fonts-freefont-ttf
          # Ensure python environment is usable
          python3 -m venv /opt/venv
          export PATH="/opt/venv/bin:$PATH"

      - name: Install Python dependencies
        run: |
          export PATH="/opt/venv/bin:$PATH"
          pip install --break-system-packages -r requirements.txt

      - name: Restore pipeline state (avoids repeating topics)
        uses: actions/cache@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      - name: Restore YouTube token (Cosmic Curious)
        # To bring a new channel online later (e.g. Jungle Ke Dost):
        # 1. Add a YOUTUBE_TOKEN_<CHANNEL> repo secret (Settings > Secrets
        #    and variables > Actions), matching the process used here.
        # 2. Add a step like this one for it, decoding into
        #    tokens/<channel_id>_token.pickle.
        # 3. Add its channel_id to ENABLED_CHANNELS below.
        # Skipping any of these 3 steps means its scheduled uploads will
        # fail with a missing-token error, not silently do nothing.
        env:
          TOKEN_COSMIC_CURIOUS: ${{ secrets.YOUTUBE_TOKEN_COSMIC_CURIOUS }}
        run: |
          mkdir -p tokens
          echo "$TOKEN_COSMIC_CURIOUS" | base64 -d > tokens/cosmic_curious_token.pickle

      # Manual single-channel run (for testing via "Run workflow" button)
      - name: Manual run
        if: github.event_name == 'workflow_dispatch' && inputs.channel != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          export PATH="/opt/venv/bin:$PATH"
          python3 -m src.main "${{ inputs.channel }}" \
            ${{ inputs.short == 'true' && '--short' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Normal scheduled run — the scheduler decides what's due.
      # ENABLED_CHANNELS restricts this to Cosmic Curious only.
      - name: Scheduled run
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == '')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          ENABLED_CHANNELS: "cosmic_curious"
        run: |
          export PATH="/opt/venv/bin:$PATH"
          python3 -m src.scheduler

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: pipeline-state-${{ github.run_id }}
