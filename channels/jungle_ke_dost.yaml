channel_id: jungle_ke_dost
display_name: "Jungle Ke Dost"
niche: "Hindi kids' rhymes, moral stories, and early learning for young children"
tone: "warm, gentle, playful, encouraging -- for children ages 2-7, but kept charming enough that a parent watching along enjoys it too"

# Tells main.py to use the puppet-animation pipeline (generate_kids_video.py
# + generate_mascot_assets.py) instead of the stock-footage pipeline the
# other three channels use.
visual_style: "puppet_animation"

content_types: [rhyme, story, learning]
mascot_map:
  rhyme: elephant
  story: bear
  learning: bunny
mascot_names:
  elephant: "Gullu Hathi"
  bear: "Bhalu Bhaiya"
  bunny: "Chintu Khargosh"

# Rhymes need one consistent language for the rhyme scheme/meter to work --
# forced to Hindi regardless of the setting below (see generate_script.py).
rhymes_hindi_only: true
# Used for story/learning content only.
languages: ["hi", "en"]

voices:
  hi: "hi-IN-MadhurNeural"
  en: "en-US-GuyNeural"

# COPPA / YouTube "Made for Kids" compliance -- see upload_youtube.py.
# This disables personalized ads and comments on every upload from this
# channel, automatically, regardless of the privacy_status passed in.
made_for_kids: true

category_id: "1"  # Film & Animation

video_length_seconds: 150   # ~2.5 min long-form
short_length_seconds: 45

upload_time_utc: "12:30"
shorts_upload_times_utc: ["09:30", "11:30", "14:30", "16:30", "18:30"]

topics_seed_files:
  rhyme: "channels/jungle_ke_dost_rhyme_topics.txt"
  story: "channels/jungle_ke_dost_story_topics.txt"
  learning: "channels/jungle_ke_dost_learning_topics.txt"

tags: ["kids rhymes", "hindi rhymes", "bacchon ki kahani", "kids learning", "hindi kids stories", "jungle ke dost"]
